<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Hi, I'm Arvind.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4fbff"/><stop offset=".5" stop-color="#eef4ff"/><stop offset="1" stop-color="#f3f0ff"/></linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
    <clipPath id="frame"><rect width="1200" height="380" rx="32"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <g filter="url(#soft)" opacity=".55">
      <circle cx="220" cy="90" r="170" fill="#67e8f9"><animate attributeName="cx" values="220;300;220" dur="16s" repeatCount="indefinite"/></circle>
      <circle cx="980" cy="330" r="190" fill="#a5b4fc"><animate attributeName="cy" values="330;270;330" dur="19s" repeatCount="indefinite"/></circle>
      <circle cx="640" cy="60" r="120" fill="#6ee7b7"><animate attributeName="cx" values="640;560;640" dur="22s" repeatCount="indefinite"/></circle>
    </g>
    <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">
      <text x="600" y="118" font-size="24" font-weight="600" fill="#0f766e">Hi, I'm</text>
      <text x="600" y="214" font-size="104" font-weight="800" fill="#101828" letter-spacing="-4">Arvind</text>
      <path d="M452 240 C520 262, 680 262, 748 240" fill="none" stroke="#0d9488" stroke-width="7" stroke-linecap="round" stroke-dasharray="320" stroke-dashoffset="320"><animate attributeName="stroke-dashoffset" values="320;0" dur="1.4s" begin="0.4s" fill="freeze"/></path>
      <g font-size="19" font-weight="600" fill="#344054">
        <rect x="372" y="292" width="140" height="42" rx="21" fill="#101828" fill-opacity=".06"/><text x="442" y="319">Clayshell</text>
        <rect x="530" y="292" width="140" height="42" rx="21" fill="#101828" fill-opacity=".06"/><text x="600" y="319">OpenDMG</text>
        <rect x="688" y="292" width="140" height="42" rx="21" fill="#101828" fill-opacity=".06"/><text x="758" y="319">still learning</text>
      </g>
    </g>
  </g>
</svg>
